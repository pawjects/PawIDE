<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="PawIDE - Professional Web Compiler">
    <title>PawIDE - Code Anywhere</title>
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Styles & Engine -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h1>PawIDE</h1>
        </div>
        <div class="splash-loader"></div>
    </div>

    <!-- Notification Container -->
    <div id="notification-container"></div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-box" id="settings-box">
            <div class="modal-header">
                <h2>Workspace Settings</h2>
                <button id="close-settings" class="icon-btn" title="Close Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="setting-row">
                    <div class="setting-info">
                        <span class="setting-title">Font Size</span>
                        <span class="setting-desc">Editor text size in pixels</span>
                    </div>
                    <select id="setting-fontsize" class="setting-select">
                        <option value="12">12px</option>
                        <option value="14" selected>14px</option>
                        <option value="16">16px</option>
                        <option value="18">18px</option>
                    </select>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <span class="setting-title">Word Wrap</span>
                        <span class="setting-desc">Wrap long lines of code</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="setting-wordwrap">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-row">
                    <div class="setting-info">
                        <span class="setting-title">Auto-Run Preview</span>
                        <span class="setting-desc">Update preview while typing</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="setting-autorun" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- App Wrapper -->
    <div class="app-wrapper">
        
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-top">
                <button class="sidebar-btn active" title="Explorer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                </button>
            </div>
            <div class="sidebar-bottom">
                <button class="sidebar-btn" id="btn-settings" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </nav>

        <!-- Main Workspace Area -->
        <main class="workspace">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <span class="branding-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        PawIDE
                    </span>
                    <div class="typing-indicator hidden" id="typing-indicator">Saving...</div>
                </div>
                
                <div class="topbar-right">
                    <!-- Dynamic Install Button (Hidden by default until SW confirms capability) -->
                    <button class="btn btn-primary hidden" id="btn-install" title="Install App">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Install</span>
                    </button>
                    
                    <button class="btn btn-secondary" id="btn-toggle-preview" title="Toggle Code / Preview View">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <button class="btn btn-secondary" id="btn-download" title="Download Source">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                    <button class="btn btn-accent" id="btn-run">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg> 
                        <span>Run</span>
                    </button>
                </div>
            </header>

            <div class="split-view" id="main-split-view">
                <!-- Editor Section -->
                <div class="editor-section">
                    <div class="editor-tabs">
                        <div class="tab active" data-file="html"><span style="color:#e34f26">●</span> index.html</div>
                        <div class="tab" data-file="css"><span style="color:#1572B6">●</span> style.css</div>
                        <div class="tab" data-file="js"><span style="color:#F7DF1E">●</span> script.js</div>
                    </div>
                    <div class="editor-container" id="monaco-container"></div>
                </div>

                <div class="drag-resizer core-resizer" id="resizer-2"></div>

                <!-- Preview Section -->
                <div class="preview-section">
                    <div class="preview-tabs">
                        <div class="tab active" data-view="preview">Preview</div>
                        <div class="tab" data-view="console">Console <span id="console-badge" class="badge hidden">0</span></div>
                    </div>
                    <div class="preview-wrapper device-desktop" id="preview-wrapper">
                        <iframe id="preview-frame" sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
                        <div id="console-wrapper" class="hidden">
                            <div class="console-output" id="console-output"><div class="console-log system-log">Console initialized.</div></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
